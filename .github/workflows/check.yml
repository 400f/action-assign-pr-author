name: check
on:
  pull_request:

permissions: {}

jobs:
  check: # dist/ is what the action runs, so it must match a fresh build of the sources
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run format-check
      - run: npm run lint
      - run: npm run build
      - run: npm run package
      - run: test -z "$(git status --porcelain dist/)" || { git status --porcelain dist/; exit 1; }
